[build]
  base = "."
  command = "npm run build -w client"
  publish = "client/dist"

[build.environment]
  VITE_SOCKET_URL = "https://second-hand-marketplace-wzvy.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://second-hand-marketplace-wzvy.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://second-hand-marketplace-wzvy.onrender.com/socket.io/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
