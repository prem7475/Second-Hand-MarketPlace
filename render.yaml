services:
  - type: web
    name: refind-api
    runtime: node
    branch: main
    plan: starter
    rootDir: .
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        value: https://refind-olx.netlify.app
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: ALLOW_DEMO_SEED
        value: 'true'
